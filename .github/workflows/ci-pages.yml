# Test a ogni push. Dal branch predefinito pubblica la versione web su GitHub Pages
# e l'APK Android nella release "android-latest".
# Prima volta: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Test e pubblicazione

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Copia app/ dentro il progetto Android e aggiorna i plugin Capacitor.
      - run: npx cap sync android
      - name: Compila APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk HomeTivu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeTivu-apk
          path: HomeTivu.apk
      - name: Pubblica nella release android-latest
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest HomeTivu.apk \
            --target "${{ github.sha }}" \
            --title "App Android (ultima versione)" \
            --notes "Build ${{ github.run_number }} del commit ${{ github.sha }}. Scarica HomeTivu.apk dal telefono e installalo (vedi README)."

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Solo i file web: niente manifest Tizen o file di progetto.
      - run: rsync -a --exclude config.xml --exclude .project --exclude .tproject app/ _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
