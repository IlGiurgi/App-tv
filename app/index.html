<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HomeTivu</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Un errore imprevisto non deve lasciare la pagina vuota: lo mostriamo a schermo.
    window.onerror = function (message, source, line) {
      if (message === 'Script error.') return; // errori opachi delle librerie esterne
      var box = document.getElementById('fatal-error');
      if (!box || box.style.display === 'block') return;
      box.textContent = 'Errore: ' + message + '\n' + String(source || '').split('/').pop() + ':' + line;
      box.style.display = 'block';
    };
  </script>
  <!-- API Samsung (AVPlay). Disponibile solo sulla TV: nel browser il caricamento fallisce senza conseguenze. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <!-- Superficie video: AVPlay sulla TV, <video> nel browser. Resta sotto all'interfaccia. -->
  <object id="av-player" type="application/avplayer"></object>
  <video id="html5-player"></video>

  <div id="app">
    <section id="screen-login" class="screen"></section>

    <section id="screen-launcher" class="screen"></section>

    <section id="screen-browse" class="screen">
      <header class="topbar">
        <div class="brand">Home<span>Tivu</span></div>
        <nav class="tabs scroll"></nav>
        <div class="clock"></div>
      </header>
      <div class="browse-body">
        <aside class="categories scroll"></aside>
        <main class="content">
          <h2 class="items-title"></h2>
          <div class="items scroll"></div>
        </main>
      </div>
      <footer class="hints">
        <span><b>OK</b> apri</span>
        <span><b class="key-red">●</b> preferiti</span>
        <span><b>INDIETRO</b> torna su / esci</span>
      </footer>
    </section>

    <section id="screen-detail" class="screen">
      <div class="back-button" data-action="back">← Indietro</div>
      <div class="detail-poster"></div>
      <div class="detail-body">
        <h1 class="detail-title"></h1>
        <p class="detail-meta"></p>
        <p class="detail-plot"></p>
        <div class="detail-actions"></div>
        <div class="detail-seasons scroll"></div>
        <div class="detail-episodes scroll"></div>
      </div>
    </section>

    <section id="screen-player" class="screen">
      <div class="player-top">
        <div class="player-heading">
          <h1 class="player-title"></h1>
          <p class="player-subtitle"></p>
        </div>
        <div class="player-top-right">
          <div class="player-clock"></div>
          <div class="back-button" data-action="back">← Indietro</div>
        </div>
      </div>
      <div class="player-status"></div>
      <div class="player-digits"></div>
      <div class="player-bottom">
        <!-- Canali live: banner con numero, logo, programma in onda e successivo (classe is-live). -->
        <div class="player-num"></div>
        <div class="player-logo-box"><img class="player-logo" alt=""></div>
        <div class="player-info">
          <p class="player-channel"></p>
          <p class="epg-now"></p>
          <div class="player-progress-row">
            <span class="epg-start"></span>
            <div class="progress"><div class="progress-bar"></div></div>
            <span class="epg-end"></span>
            <span class="epg-left"></span>
          </div>
          <p class="player-time"></p>
          <p class="epg-next"></p>
          <div class="player-tags"></div>
        </div>
      </div>
    </section>

    <section id="screen-camera" class="screen">
      <img class="camera-full" alt="">
      <div class="camera-top">
        <h1 class="camera-title"></h1>
        <div class="back-button" data-action="back">← Indietro</div>
      </div>
      <div class="camera-status"></div>
    </section>

    <!-- Telecamera che compare in alto a destra quando scatta un sensore di movimento (solo TV). -->
    <div id="home-popup">
      <img alt="">
      <span class="home-popup-name"></span>
    </div>

    <div id="toast"></div>
    <div id="loader"><div class="spinner"></div></div>
  </div>

  <div id="fatal-error"></div>

  <script src="js/xtream.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/home.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
  <script src="js/screens/login.js"></script>
  <script src="js/screens/browse.js"></script>
  <script src="js/screens/launcher.js"></script>
  <script src="js/screens/detail.js"></script>
  <script src="js/screens/player-screen.js"></script>
  <script src="js/screens/camera.js"></script>
  <script src="js/pointer.js"></script>
  <script src="js/screensaver.js"></script>
</body>
</html>
