<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona HomeTivu: casa (Home Assistant) ruotata a punta verso destra, come un tasto play.
       Sorgente unica: dev/icon/render.js ne ricava le PNG per Tizen e Android. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#14161f"/>
  <g id="mark">
    <path d="M420 256 L300 118 H112 V394 H300Z" fill="url(#g)" stroke="url(#g)" stroke-width="24" stroke-linejoin="round"/>
    <rect x="170" y="220" width="64" height="64" rx="10" fill="#14161f"/>
  </g>
</svg>
