<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona Telesfera: una sfera blu (il mondo dei canali) con il tasto play al centro.
       Sorgente unica: dev/icon/render.js ne ricava le PNG per Tizen e Android. -->
  <defs>
    <radialGradient id="globe" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="0.45" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#1a2a8c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dbbff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9dbbff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sphere"><circle cx="256" cy="256" r="150"/></clipPath>
  </defs>
  <g id="mark">
    <circle cx="256" cy="256" r="150" fill="url(#globe)"/>
    <!-- meridiani e paralleli appena accennati -->
    <g clip-path="url(#sphere)" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5">
      <ellipse cx="256" cy="256" rx="60" ry="150"/>
      <ellipse cx="256" cy="256" rx="115" ry="150"/>
      <line x1="106" y1="256" x2="406" y2="256"/>
      <ellipse cx="256" cy="186" rx="140" ry="30"/>
      <ellipse cx="256" cy="326" rx="140" ry="30"/>
    </g>
    <!-- anello orbitale, come un segnale che gira attorno alla sfera -->
    <ellipse cx="256" cy="256" rx="205" ry="62" fill="none" stroke="url(#ring)" stroke-width="12"
             transform="rotate(-24 256 256)"/>
    <!-- tasto play -->
    <path d="M226 196 L318 256 L226 316 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
