<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SitoTV</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; background: #101422; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
#box { position: absolute; left: 50%; top: 50%; width: 1100px; margin-left: -550px; -webkit-transform: translateY(-50%); transform: translateY(-50%); text-align: center; }
h1 { font-size: 64px; margin: 0 0 40px; }
h1 span { color: #5aa9ff; }
p { font-size: 30px; color: #b8c0d8; margin: 0 0 30px; }
#url { width: 100%; box-sizing: border-box; font-size: 36px; padding: 18px 24px; border: 4px solid #2a3150; border-radius: 12px; background: #1b2136; color: #fff; outline: none; }
#open { margin-top: 30px; font-size: 36px; padding: 16px 60px; border: 4px solid #2a3150; border-radius: 12px; background: #1b2136; color: #fff; outline: none; }
.focus { border-color: #5aa9ff !important; background: #24305a !important; }
#status { min-height: 40px; }
.hidden { display: none; }
</style>
</head>
<body>
<div id="box">
  <h1>Sito<span>TV</span></h1>
  <p id="status"></p>
  <div id="form">
    <p>Scrivi l'indirizzo del sito da aprire (OK per scrivere).</p>
    <input id="url" type="url" placeholder="esempio.it" autocomplete="off">
    <button id="open">Apri</button>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
